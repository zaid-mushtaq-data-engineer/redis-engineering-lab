spring:
  application:
    name: redis-engineering-lab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 1s
      connect-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: always
      status:
        order: DOWN,OUT_OF_SERVICE,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200

app:
  environment: dev
  admin:
    api-key: ${ADMIN_API_KEY}
  redis:
    project: redis-lab
    ttl:
      product: PT15M
      inventory: PT30S
      product-list: PT15M
  rate-limit:
    enabled: true
    capacity: 10
    refill-tokens-per-second: 1
    key-ttl-after-full: PT60S
    trust-forwarded-headers: false
  pagination:
    default-size: 20
    max-size: 50
  inventory:
    max-stock-quantity: 1000000000
  dev-endpoints:
    enabled: false
  dev:
    seed-catalog: false
