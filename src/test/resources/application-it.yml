spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true

app:
  environment: test
  admin:
    api-key: test-admin-key-for-integration-tests
  redis:
    project: redis-lab
    ttl:
      product: PT15M
      inventory: PT30S
      product-list: PT15M
  rate-limit:
    enabled: true
    capacity: 10
    refill-tokens-per-second: 1
    key-ttl-after-full: PT60S
    trust-forwarded-headers: false
  pagination:
    default-size: 20
    max-size: 50
  inventory:
    max-stock-quantity: 1000000000
  dev-endpoints:
    enabled: false
  dev:
    seed-catalog: false
